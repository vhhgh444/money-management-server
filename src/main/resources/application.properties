spring.application.name=moneymanagement
spring.datasource.url=jdbc:mysql://localhost:3306/moneymanager
spring.datasource.username=root
spring.datasource.password=anuj@2005

server.servlet.context-path=/api/v1.0

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format-sql=true

spring.mail.host=smtp-relay.brevo.com
spring.mail.port=2525

# SMTP Login from Brevo
spring.mail.username=${MAIL_USERNAME}

# Paste the FULL SMTP key copied from Brevo
spring.mail.password=${MAIL_PASSWORD}

spring.mail.protocol=smtp

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Sender email (must be verified in Brevo)
spring.mail.properties.mail.smtp.from=${MAIL_FROM}

spring.mail.test-connection=false


logging.level.org.springframework.mail=DEBUG
logging.level.org.eclipse.angus.mail=DEBUG
logging.level.org.eclipse.angus.mail.smtp=DEBUG

#jwt token part
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

money.manager.frontend.url=${FRONTEND_URL}
app.activation.url=${MONEY_MANAGER_BACKEND_URL}

spring.profiles.active=prod